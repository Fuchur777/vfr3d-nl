<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- vfr3d.nl: stacked airspace volumes (TMA over CTR) with a climbing aircraft -->
  <rect width="64" height="64" rx="14" fill="#1b232b"/>
  <!-- upper, wider layer (TMA) -->
  <path d="M8 27v6c0 4 10.7 7 24 7s24-3 24-7v-6" fill="#185FA5" fill-opacity=".35" stroke="#378ADD" stroke-width="2"/>
  <ellipse cx="32" cy="27" rx="24" ry="7" fill="#185FA5" fill-opacity=".55" stroke="#378ADD" stroke-width="2"/>
  <!-- lower, narrower layer (CTR) -->
  <path d="M18 44v6c0 3 6.3 5 14 5s14-2 14-5v-6" fill="#378ADD" fill-opacity=".35" stroke="#74b3f0" stroke-width="2"/>
  <ellipse cx="32" cy="44" rx="14" ry="5" fill="#378ADD" fill-opacity=".55" stroke="#74b3f0" stroke-width="2"/>
  <!-- aircraft climbing out, top right -->
  <g transform="translate(45 13) rotate(-35)" fill="#ffc24b">
    <path d="M-9 -1.3h14l4 1.3-4 1.3h-14z"/>
    <path d="M-1 -1h3l-3 -8h-2z"/>
    <path d="M-1 1h3l-3 8h-2z"/>
    <path d="M-8 -1h2l-2.5 -4h-1.5z"/>
    <path d="M-8 1h2l-2.5 4h-1.5z"/>
  </g>
</svg>
