name: Status-check
# Hourly: when data in the app is certainly outdated (red), open an issue; GitHub mails it to the repo owner.
# Closes that issue again once everything is current.
on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # only for the log: what the FUA Worker read last, incl. the portal rows and plans for later days (threads can't reach the Worker)
      - run: |
          curl -s 'https://vfr3d-fua.frank-e97.workers.dev/?debug' | head -n 5
          curl -s 'https://vfr3d-fua.frank-e97.workers.dev/?debug' | tail -n 40
          curl -s 'https://vfr3d-fua.frank-e97.workers.dev/' | jq -c '{type, datum, opgehaald, n: (.gebieden | length), volgende: [.volgende[]? | {datum, type, opgehaald, n: (.gebieden | length)}]}'
        continue-on-error: true
      - run: |
          node .github/status-check.mjs > red.md
          open=$(gh issue list --state open --search 'in:title "Verouderde data"' --json number --jq '.[0].number')
          if [ -s red.md ] && [ -z "$open" ]; then
            gh issue create --title "Verouderde data op vfr3d.nl" --body "$(cat red.md; printf '\n\ncc @%s' "$GITHUB_REPOSITORY_OWNER")"
          elif [ ! -s red.md ] && [ -n "$open" ]; then
            gh issue close "$open" --comment "Alles weer actueel."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
