name: eAIP probe
on:
  push:
    branches: [claude/project-thread-0au64z]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for l in 10 11; do
            U="https://services-eu1.arcgis.com/OtUwzhpKSdeXgRIB/arcgis/rest/services/Aerodrome_data/FeatureServer/$l/query?where=1%3D1&outFields=*&outSR=4326&f=geojson"
            echo "== layer $l"; curl -sS "$U" | jq -c '.features | length, .[0:3][]'
            curl -sS "$U" | jq -r '.features[].properties | [.[]] | map(tostring) | join(" | ")' | head -80
          done
