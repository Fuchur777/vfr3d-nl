name: probe
on: { push: { branches: [claude/project-thread-0au64z] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for l in EB,EL ED; do
            echo "== FUA $l"; curl -s "https://vfr3d-fua.frank-e97.workers.dev/?land=$l" | jq -c '{fout, type, opgehaald, n: (.gebieden|length)}'
            echo "== gebieden $l"; curl -si "https://vfr3d-fua.frank-e97.workers.dev/gebieden?land=$l" | head -12
            curl -s "https://vfr3d-fua.frank-e97.workers.dev/gebieden?land=$l" | jq -r '.features[].properties.Designator' | head -30 | tr '\n' ' '; echo
          done
          curl -s https://vfr3d.nl/index_beta.html | grep -n -E "gebieden|fuaKey|const LAND" | head
