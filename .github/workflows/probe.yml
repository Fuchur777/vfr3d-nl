name: eAIP probe
on:
  push:
    branches: [claude/project-thread-0au64z]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS 'https://services-eu1.arcgis.com/OtUwzhpKSdeXgRIB/arcgis/rest/services?f=json' | jq -r '.services[] | "\(.name) \(.type)"'
          for s in $(curl -sS 'https://services-eu1.arcgis.com/OtUwzhpKSdeXgRIB/arcgis/rest/services?f=json' | jq -r '.services[] | select(.type=="FeatureServer") | .name'); do
            echo "== $s"; curl -sS "https://services-eu1.arcgis.com/OtUwzhpKSdeXgRIB/arcgis/rest/services/$s/FeatureServer?f=json" | jq -r '.layers[]? | "\(.id) \(.name)"'
          done
