name: NOTAM-vorm
# Every morning after the 06:00 LT NOTAM fetch: NOTAMs about airspace without an LVNL shape, or in doubt about red or green, go into an issue; GitHub mails it to the repo owner.
# A changed list is posted as a comment (mails again); the issue closes once nothing is left to check.
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          node .github/notam-vorm.mjs > vorm.md
          open=$(gh issue list --state open --search 'in:title "NOTAMs om na te kijken"' --json number --jq '.[0].number')
          if [ -s vorm.md ] && [ -z "$open" ]; then
            gh issue create --title "NOTAMs om na te kijken" --body "$(cat vorm.md; printf '\n\ncc @%s' "$GITHUB_REPOSITORY_OWNER")"
          elif [ -s vorm.md ] && [ "$(gh issue view "$open" --json body --jq .body)" != "$(cat vorm.md)" ]; then
            gh issue edit "$open" --body-file vorm.md
            gh issue comment "$open" --body-file vorm.md
          elif [ ! -s vorm.md ] && [ -n "$open" ]; then
            gh issue close "$open" --comment "Niets meer na te kijken."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
